[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperfields"
version = "0.1.0"
description = "The hyperfields ecosystem catalogue, read from the Lean registry"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tyler Roost"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.11", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperfields = ["py.typed", "bridges.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-vv -s --durations=10 --timeout=30"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

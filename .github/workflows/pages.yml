name: Lean explainer and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hyperfields
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and audit Lean
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          axiom-audit: true
          use-mathlib-cache: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned lean4-explainer
        env:
          EXPLAINER_REVISION: 6e884c45cb3bc5e2b5f9779c60bad048ba92b15d
        run: |
          git clone --filter=blob:none https://github.com/TimeLordRaps/lean4-explainer "$RUNNER_TEMP/lean4-explainer"
          git -C "$RUNNER_TEMP/lean4-explainer" checkout --detach "$EXPLAINER_REVISION"
          python -m pip install \
            "$RUNNER_TEMP/lean4-explainer" \
            "$RUNNER_TEMP/lean4-explainer/packages/reader" \
            "$RUNNER_TEMP/lean4-explainer/packages/map" \
            "$RUNNER_TEMP/lean4-explainer/packages/l4del" \
            "$RUNNER_TEMP/lean4-explainer/packages/lean"

      - name: Check every L4DEL annotation
        run: lean4-explainer check --lean-root . --cache "$RUNNER_TEMP/check-cache"

      - name: Build source-pinned proofsite
        run: |
          python scripts/write_explainer_config.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/lean4-explainer.toml"
          lean4-explainer build \
            --lake-root . \
            --out site \
            --config "$RUNNER_TEMP/lean4-explainer.toml" \
            --cache "$RUNNER_TEMP/site-cache"
          python scripts/check_site.py --site site --revision "$GITHUB_SHA"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload proofsite
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy proofsite
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
